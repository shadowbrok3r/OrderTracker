[package]
name = "order_tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7", features = ["fullstack"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
jewelry_shared = { path = "jewelry_shared", default-features = false }

# Server-only deps (not WASM-compatible)
tokio = { version = "1", features = ["full"], optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
surrealdb = { version = "3.2.0-beta.2", default-features = false, features = ["protocol-ws"], optional = true }
surrealdb-types = { version = "3.2.0-beta.2", optional = true }
openssl = { version = "0.10", features = ["vendored"], optional = true }
directories = { version = "6.0.0", optional = true }
dotenvy = { version = "0.15.7", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = []
server = ["dioxus/server", "dep:tokio", "dep:reqwest", "dep:surrealdb", "dep:surrealdb-types", "dep:openssl", "dep:directories", "dep:dotenvy", "jewelry_shared/surreal", "dep:tower", "dep:tower-http", "dep:tracing", "dep:tracing-subscriber", "dep:base64"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }

[build-dependencies]
dotenvy = "0.15.7"
