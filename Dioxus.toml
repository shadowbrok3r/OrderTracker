[application]
name = "order_tracker"
default_platform = "web"
asset_dir = "assets"

# Release wasm-opt can abort on newer rustc DWARF; strip debug for stable CI/HA builds.
[web.wasm_opt]
debug = false
keep_names = false

[desktop]
title = "Order Tracker - Shopify & Etsy"

[desktop.window]
width = 1400
height = 900
resizable = true
decorations = true

[bundle]
identifier = "com.ordertracker.app"
publisher = "Order Tracker"
